name: Bug report
description: Report a defect in the platform.
title: "[Bug]: "
labels: ["type: bug", "status: triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - api
        - ios
        - android
        - content
        - design-system
        - docs
    validations:
      required: true
